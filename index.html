<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seminario demostrativo de resina · Resina Lab</title>
<meta name="description" content="Seminario demostrativo de resina. Acceso programado a dos clases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1722; --ink2:#14263a; --teal:#19c3b1; --amber:#ffb24a; --pink:#ff5fa2; --mist:#e9f4f3;
  --line:rgba(233,244,243,.16);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--mist);font-family:'Figtree',system-ui,sans-serif;line-height:1.55;min-height:100vh;overflow-x:hidden}
h1,h2,.num{font-family:'Bricolage Grotesque','Figtree',sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* fondo: capas de resina que se mezclan lento */
.pour{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.pour i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.pour i:nth-child(1){width:60vmax;height:60vmax;background:var(--teal);left:-20vmax;top:-18vmax}
.pour i:nth-child(2){width:48vmax;height:48vmax;background:var(--pink);right:-18vmax;top:18vh;animation-duration:28s;opacity:.26}
.pour i:nth-child(3){width:40vmax;height:40vmax;background:var(--amber);left:10vw;bottom:-22vmax;animation-duration:25s;opacity:.2}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
@media (prefers-reduced-motion:reduce){.pour i{animation:none}}

.wrap{position:relative;z-index:1;width:min(920px,100% - 40px);margin-inline:auto}
header{padding:28px 0 8px;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:50% 50% 50% 8px;background:linear-gradient(135deg,var(--teal),var(--amber));flex:none}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:.01em}

.hero{padding:44px 0 28px}
h1{font-weight:800;font-size:clamp(2.3rem,7.6vw,4.4rem);line-height:1.02;letter-spacing:-.025em;max-width:15ch}
.sub{margin-top:20px;font-size:1.1rem;max-width:46ch;color:rgba(233,244,243,.82)}
.sub b{color:#fff;font-weight:600}

/* escenario */
.stage{margin-top:34px;border:1px solid var(--line);border-radius:22px;background:rgba(12,23,34,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.stage-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:1.25rem;font-weight:600}
.chip{font-size:.85rem;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.chip.live{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.wait{color:var(--amber);border-color:rgba(255,178,74,.5)}
.chip.done{color:rgba(233,244,243,.6)}
.panel{padding:34px 22px 38px;text-align:center}
.panel[hidden]{display:none}
.when{font-size:1.05rem;color:rgba(233,244,243,.85)}
.when small{display:block;margin-top:4px;font-size:.88rem;color:rgba(233,244,243,.55)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:26px auto 6px}
.cell{border:1px solid var(--line);border-radius:16px;padding:14px 4px 10px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.num{display:block;font-weight:800;font-size:clamp(2rem,9vw,3.3rem);line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:.8rem;color:rgba(233,244,243,.6)}
.hint{margin-top:18px;font-size:.95rem;color:rgba(233,244,243,.7)}

.player{position:relative;aspect-ratio:16/9;background:#000}
.player #yt,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0;z-index:2}
.sound{position:absolute;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);font:600 1rem 'Figtree',sans-serif;background:var(--amber);color:#1a1205;border:0;border-radius:99px;padding:12px 22px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.sound[hidden]{display:none}
.msg{padding:48px 22px;text-align:center;color:rgba(233,244,243,.8)}

.btn{display:inline-block;margin-top:22px;padding:14px 26px;border-radius:99px;font-weight:600;text-decoration:none;background:var(--teal);color:#04201c;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--mist);border:1px solid var(--line);margin-left:8px}
.btn[hidden]{display:none}

/* agenda */
.agenda{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 60px}
@media(max-width:620px){.agenda{grid-template-columns:1fr}.btn.alt{margin:12px 0 0}}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:16px 18px;border-radius:14px;border-left:4px solid var(--line);background:rgba(255,255,255,.04)}
.item:hover{background:rgba(255,255,255,.08)}
.item.on{border-left-color:var(--teal);background:rgba(25,195,177,.1)}
.item strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.15rem}
.item span{font-size:.92rem;color:rgba(233,244,243,.7)}
footer{position:relative;z-index:1;text-align:center;padding:0 20px 40px;font-size:.85rem;color:rgba(233,244,243,.45)}
</style>
</head>
<body>
<div class="pour" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header><div class="mark"></div><div class="brand" id="brand"></div></header>

  <section class="hero">
    <h1>Seminario demostrativo de resina</h1>
    <p class="sub" id="sub"></p>

    <div class="stage" id="stage">
      <div class="stage-head"><h2 id="sTitle"></h2><span class="chip" id="sChip"></span></div>

      <div class="panel" id="pWait" hidden>
        <p class="when" id="when"></p>
        <div class="count" role="timer" aria-live="off">
          <div class="cell"><span class="num" id="cd">00</span><span class="lbl">días</span></div>
          <div class="cell"><span class="num" id="ch">00</span><span class="lbl">horas</span></div>
          <div class="cell"><span class="num" id="cm">00</span><span class="lbl">min</span></div>
          <div class="cell"><span class="num" id="cs">00</span><span class="lbl">seg</span></div>
        </div>
        <p class="hint">El acceso al video se habilita únicamente durante el horario de la clase.</p>
        <a class="btn" id="wa" hidden target="_blank" rel="noopener"></a>
      </div>

      <div id="pLive" hidden>
        <div class="player"><div id="yt"></div><div class="shield"></div><button class="sound" id="sound" hidden>Activar sonido</button></div>
      </div>

      <div class="msg" id="pMsg" hidden></div>

      <div class="panel" id="pDone" hidden>
        <p class="when" id="doneTxt"></p>
        <a class="btn" id="cta" hidden target="_blank" rel="noopener"></a>
        <a class="btn alt" id="wa2" hidden target="_blank" rel="noopener"></a>
      </div>
    </div>

    <div class="agenda" id="agenda"></div>
  </section>
</div>
<footer id="foot"></footer>

<script>
/* ============ EDITA SOLO ESTA PARTE ============ */
const CONFIG = {
  marca: 'Resina Lab',
  instructor: 'Yuly Rivas',
  // Pega aquí el link de WhatsApp del grupo y el link de Hotmart (déjalos '' para ocultar el botón)
  whatsappUrl: '',
  whatsappTexto: 'Unirme al grupo de WhatsApp',
  ctaUrl: '',
  ctaTexto: 'Quiero entrar al curso',
  clases: [
    {
      titulo: 'Clase 1',
      tema: 'SEMINARIO DEMOSTRATIVO DE RESINA CLASE 1',
      inicio: '2026-10-03T18:30:00-06:00',   // sábado 6:30 pm Costa Rica
      video: 'https://www.youtube.com/live/Uz3lwWWhpAs'
    },
    {
      titulo: 'Clase 2',
      tema: 'SEMINARIO DEMOSTRATIVO DE RESINA CLASE 2',
      inicio: '2026-10-04T18:30:00-06:00',   // domingo 6:30 pm Costa Rica
      video: 'https://www.youtube.com/live/d8a1Z2sXnGo'
    }
  ]
};
/* ================================================ */

const $ = id => document.getElementById(id);
const TZ = 'America/Costa_Rica';
const qs = new URLSearchParams(location.search);
// Para probar: tuweb.com/?ahora=2026-10-03T18:31:00-06:00
const skew = qs.get('ahora') ? new Date(qs.get('ahora')).getTime() - Date.now() : 0;
const now = () => Date.now() + skew;

const vid = s => { const m = String(s).match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : null); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fDia = new Intl.DateTimeFormat('es', {timeZone: TZ, weekday:'long', day:'numeric', month:'long'});
const fHora = new Intl.DateTimeFormat('es', {timeZone: TZ, hour:'numeric', minute:'2-digit', hour12:true});
const fLocal = new Intl.DateTimeFormat('es', {weekday:'long', hour:'numeric', minute:'2-digit', hour12:true});
const localTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const pad = n => String(n).padStart(2,'0');
const clean = s => s.replace(/\s?([ap])\.\s?m\./i, (_,x)=>' '+x.toLowerCase()+'m');

const clases = CONFIG.clases.map(c => ({...c, t:new Date(c.inicio).getTime(), id:vid(c.video), ended:false}));
const diaTxt = c => cap(fDia.format(c.t));
const horaTxt = c => clean(fHora.format(c.t));

$('brand').textContent = CONFIG.marca;
document.title = 'Seminario demostrativo de resina · ' + CONFIG.marca;
$('foot').textContent = '© ' + new Date().getFullYear() + ' ' + CONFIG.marca;
$('sub').innerHTML = 'Con <b>' + CONFIG.instructor + '</b>. ' + clases.map(c => '<b>' + diaTxt(c).split(' ')[0] + '</b>').join(' y ') + ' a las <b>' + horaTxt(clases[0]) + '</b>, hora Costa Rica.';

[['wa',CONFIG.whatsappUrl,CONFIG.whatsappTexto],['wa2',CONFIG.whatsappUrl,CONFIG.whatsappTexto],['cta',CONFIG.ctaUrl,CONFIG.ctaTexto]].forEach(([id,url,txt])=>{
  if(url){ const a=$(id); a.href=url; a.textContent=txt; a.hidden=false; }
});

/* agenda */
const agenda = $('agenda');
clases.forEach((c,i) => {
  const b = document.createElement('button');
  b.className = 'item'; b.type = 'button';
  b.innerHTML = '<strong>' + c.titulo + '</strong><span>' + diaTxt(c) + ' · ' + horaTxt(c) + '<br>' + c.tema + '</span>';
  b.onclick = () => { sel = i; manual = true; mounted = -1; tick(); };
  agenda.appendChild(b);
});

let sel = 0, manual = false, mounted = -1, player = null, apiReady = false, apiLoading = false, n = 0;

function loadAPI(){
  if(apiLoading) return; apiLoading = true;
  window.onYouTubeIframeAPIReady = () => { apiReady = true; apiLoading = false; tick(); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
const offset = c => Math.max(0, (now() - c.t) / 1000);

function unmount(){
  if(player){ try{ player.destroy(); }catch(e){} player = null; }
  if(!$('yt')){ const d=document.createElement('div'); d.id='yt'; document.querySelector('.player').prepend(d); }
}

function mountPlayer(i){
  const c = clases[i];
  if(!c.id){ show('pMsg'); $('pMsg').textContent = 'Falta pegar el link de YouTube de esta clase en el archivo.'; mounted = i; return; }
  if(!apiReady){ loadAPI(); return; }
  show('pLive'); unmount(); mounted = i;
  $('sound').hidden = true;
  player = new YT.Player('yt', {
    videoId: c.id,
    playerVars: {autoplay:1, mute:1, controls:0, disablekb:1, fs:0, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, start:Math.floor(offset(c))},
    events: {
      onReady: e => {
        if(offset(c) >= e.target.getDuration() - 1){ finish(i); return; }
        e.target.playVideo(); $('sound').hidden = false;
      },
      onStateChange: e => {
        if(e.data === 0) finish(i);
        if(e.data === 2){ e.target.seekTo(offset(c), true); e.target.playVideo(); }
      }
    }
  });
}

$('sound').onclick = () => { if(player){ player.unMute(); player.setVolume(100); } $('sound').hidden = true; };

function finish(i){
  clases[i].ended = true; unmount(); mounted = -1; manual = false; tick();
}

function show(id){ ['pWait','pLive','pMsg','pDone'].forEach(p => $(p).hidden = p !== id); }

function tick(){
  const t = now();
  if(!manual){
    const k = clases.findIndex(c => !c.ended);
    sel = k === -1 ? clases.length - 1 : k;
  }
  const c = clases[sel];
  const state = c.ended ? 'done' : (t >= c.t ? 'live' : 'wait');

  $('sTitle').textContent = c.titulo + ': ' + c.tema;
  const chip = $('sChip');
  chip.className = 'chip ' + state;
  chip.textContent = state === 'live' ? 'Disponible ahora' : state === 'wait' ? 'Próximamente' : 'Acceso cerrado';
  [...agenda.children].forEach((el,i) => el.classList.toggle('on', i === sel));

  if(state === 'wait'){
    if(player){ unmount(); mounted = -1; }
    show('pWait');
    let d = Math.max(0, Math.floor((c.t - t) / 1000));
    const dd = Math.floor(d/86400); d %= 86400;
    const hh = Math.floor(d/3600); d %= 3600;
    $('cd').textContent = pad(dd); $('ch').textContent = pad(hh); $('cm').textContent = pad(Math.floor(d/60)); $('cs').textContent = pad(d % 60);
    let w = diaTxt(c) + ' · ' + horaTxt(c) + ' (hora Costa Rica)';
    $('when').innerHTML = w + (localTZ !== TZ ? '<small>En tu zona: ' + cap(clean(fLocal.format(c.t))) + '</small>' : '');
  } else if(state === 'live'){
    if(mounted !== sel) mountPlayer(sel);
    else if(player && player.getCurrentTime && n % 15 === 0){
      try{ if(Math.abs(player.getCurrentTime() - offset(c)) > 6) player.seekTo(offset(c), true); }catch(e){}
    }
  } else {
    show('pDone');
    const next = clases.find(x => !x.ended);
    $('doneTxt').textContent = next
      ? 'El acceso a esta clase ya se cerró. La siguiente estará disponible el ' + diaTxt(next).toLowerCase() + ' a las ' + horaTxt(next) + ' (hora Costa Rica).'
      : 'El acceso a las dos clases ya se cerró. No hay repeticiones disponibles.';
    $('cta').hidden = !CONFIG.ctaUrl || !!next;
  }
  n++;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
